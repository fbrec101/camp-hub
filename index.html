<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REC101 Camp Hub — 2026 Camp Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --fbs:#B01515;--fcs:#457b9d;--d2:#2a9d8f;--d3:#C8A96E;--naia:#8338ec;
  --bg:#111111;--card:#1E1A16;--text:#EDE5D0;--muted:#a89a86;--border:#3D2810;
  --accent:#C4620A;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2)
}
body{font-family:'Roboto Condensed',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
h1,.school-name,.popup-school,.badge,.view-toggle button,.card-header,.filter-toggle{font-family:'Oswald',sans-serif}
header{background:#141110;border-bottom:1px solid var(--border);padding:12px 24px;position:sticky;top:0;z-index:1000}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:1.4rem;font-weight:700;white-space:nowrap;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
h1 span{font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;font-size:.85rem}
.tagline{font-size:.78rem;color:var(--muted);font-style:italic;margin-top:2px}
.mission{font-size:.75rem;color:var(--muted);margin-top:4px}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:var(--card);color:var(--text);outline:none;transition:border .2s}
.search-box input::placeholder{color:var(--muted)}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.view-toggle{display:flex;background:var(--card);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.view-toggle button{padding:8px 18px;border:none;background:transparent;font-size:.85rem;cursor:pointer;font-weight:500;transition:all .2s;color:var(--muted)}
.view-toggle button.active{background:var(--accent);color:#fff}
.filters-bar{max-width:1400px;margin:0 auto;padding:8px 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:2px solid var(--accent)}
.filters-bar select{padding:7px 28px 7px 10px;border:1px solid var(--border);border-radius:6px;font-size:.83rem;background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none;cursor:pointer;min-width:130px;font-family:'Roboto Condensed',sans-serif}
.filters-bar select:focus{border-color:var(--accent);outline:none}
.clear-btn,.filter-toggle{padding:7px 12px;border:none;background:transparent;color:var(--accent);font-size:.83rem;cursor:pointer;font-weight:500}
.filter-toggle{border:1px solid var(--border);border-radius:6px;color:var(--muted)}
.filter-toggle.active{background:rgba(196,98,10,.15);border-color:var(--accent);color:var(--text)}
.stats{color:var(--muted);font-size:.83rem;margin-left:auto;white-space:nowrap}
#load-error{max-width:1400px;margin:16px auto;padding:16px 24px;color:#f88;display:none}
#map-container{max-width:1400px;margin:0 auto;padding:0 24px;height:calc(100vh - 155px)}
#map{height:100%;border-radius:var(--radius);border:1px solid var(--border);margin-top:8px}
.map-legend{display:flex;gap:20px;padding:8px 0 4px;flex-wrap:wrap;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px}
.legend-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--border)}
#grid-container{max-width:1400px;margin:0 auto;padding:16px 24px;display:none}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.camp-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--muted);transition:transform .15s,box-shadow .15s}
.camp-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.camp-card[data-div="FBS"]{border-left-color:var(--fbs)}
.camp-card[data-div="FCS"]{border-left-color:var(--fcs)}
.camp-card[data-div="D2"]{border-left-color:var(--d2)}
.camp-card[data-div="D3"]{border-left-color:var(--d3)}
.camp-card.completed{opacity:.72;border-left-color:var(--muted)!important}
.completed-tag{font-size:.65rem;background:var(--border);color:var(--muted);padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.school-name{font-size:1.05rem;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.badge-FBS{background:var(--fbs)}.badge-FCS{background:var(--fcs)}.badge-D2{background:var(--d2)}.badge-D3{background:var(--d3)}.badge-NAIA{background:var(--naia)}
.meta{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.camp-list{list-style:none;margin-bottom:12px}
.camp-list li{font-size:.85rem;padding:3px 0;display:flex;align-items:baseline;gap:6px}
.camp-list li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);flex-shrink:0;margin-top:6px}
.camp-dates{font-size:.8rem;color:var(--muted)}
.card-footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reg-link{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;background:var(--accent);color:#fff;text-decoration:none;border-radius:6px;font-size:.8rem;font-weight:500;transition:background .2s}
.reg-link:hover{background:#a85208}
.twitter-link{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;background:var(--border);color:var(--text);text-decoration:none;border-radius:6px;font-size:.8rem;font-weight:500}
.no-reg{font-size:.78rem;color:var(--muted);font-style:italic}
.no-results{text-align:center;padding:60px 20px;color:var(--muted);font-size:1.1rem;grid-column:1/-1}
.leaflet-popup-content-wrapper{border-radius:var(--radius)!important;box-shadow:var(--shadow)!important;background:var(--card)!important;color:var(--text)!important}
.leaflet-popup-tip{background:var(--card)!important}
.leaflet-popup-content{margin:14px 16px!important;font-family:'Roboto Condensed',sans-serif!important;min-width:220px}
.leaflet-popup-close-button{color:var(--muted)!important}
.popup-school{font-size:1rem;font-weight:600;margin-bottom:4px;color:var(--accent)}
.popup-conf{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.popup-camps{list-style:none;font-size:.82rem;margin-bottom:8px}
.popup-camps li{padding:2px 0}
.popup-link{display:inline-block;margin-top:4px;padding:5px 12px;background:var(--accent);color:#fff;text-decoration:none;border-radius:5px;font-size:.78rem}
@media(max-width:768px){
  .header-inner{gap:10px}h1{font-size:1.1rem;width:100%}
  .search-box{min-width:0}#map-container{height:calc(100vh - 180px)}
  .card-grid{grid-template-columns:1fr}
  .filters-bar{padding:8px 16px}
  .filters-bar select{width:calc(50% - 6px);flex:none}
  #map-container,#grid-container{padding:0 16px}
  .stats{width:100%;margin-left:0}
}
</style>
</head>
<body>
<header><div class="header-inner">
<div><h1>REC101 Camp Hub <span>· 2026 Season</span></h1><div class="tagline">Where Education Takes the Field.</div></div>
<div class="search-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="search" placeholder="Search schools, conferences, states…"><div class="mission">The only free camp database built for families, not recruiters.</div></div>
<div class="view-toggle"><button id="btn-map" class="active" onclick="setView('map')">Map</button><button id="btn-grid" onclick="setView('grid')">Grid</button></div>
</div></header>
<div class="filters-bar">
<select id="filter-division"><option value="">All Divisions</option><option>FBS</option><option>FCS</option><option>D2</option><option>D3</option><option>NAIA</option></select>
<select id="filter-state"><option value="">All States</option></select>
<select id="filter-conference"><option value="">All Conferences</option></select>
<select id="filter-camp-type"><option value="">All Camp Types</option></select>
<select id="filter-month"><option value="">All Months</option><option>June</option><option>July</option><option>August</option></select>
<select id="filter-sort"><option value="soonest">Soonest First</option><option value="school">School A–Z</option><option value="division">Division</option></select>
<button class="filter-toggle active" id="toggle-upcoming" type="button">Upcoming Only</button>
<button class="clear-btn" type="button" onclick="clearFilters()">Clear</button>
<div class="stats" id="stats"></div>
</div>
<div id="load-error"></div>
<div id="map-container"><div id="map"></div>
<div class="map-legend"><div class="legend-item"><div class="legend-dot" style="background:var(--fbs)"></div>FBS</div><div class="legend-item"><div class="legend-dot" style="background:var(--fcs)"></div>FCS</div><div class="legend-item"><div class="legend-dot" style="background:var(--d2)"></div>D2</div><div class="legend-item"><div class="legend-dot" style="background:var(--d3)"></div>D3</div><div class="legend-item"><div class="legend-dot" style="background:var(--naia)"></div>NAIA</div></div></div>
<div id="grid-container"><div class="card-grid" id="card-grid"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DIV_COLORS = { FBS: '#B01515', FCS: '#457b9d', D2: '#2a9d8f', D3: '#C8A96E', NAIA: '#8338ec' };
const STATE_NAMES = {
  AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',
  DE:'Delaware',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',
  KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',
  MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',
  NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',
  OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',
  TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',DC:'D.C.'
};

let campData = [];
let schoolCoords = {};
let map, markerLayer;
let currentView = 'map';
let upcomingOnly = true;

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getFilters() {
  return {
    division: document.getElementById('filter-division').value,
    state: document.getElementById('filter-state').value,
    conference: document.getElementById('filter-conference').value,
    campType: document.getElementById('filter-camp-type').value,
    month: document.getElementById('filter-month').value,
    sort: document.getElementById('filter-sort').value,
    search: document.getElementById('search').value.toLowerCase().trim()
  };
}

function matchesFilters(s, f) {
  if (f.division && s.division !== f.division) return false;
  if (f.state && s.state !== f.state) return false;
  if (f.conference && s.conference !== f.conference) return false;
  if (f.campType && !s.camp_types.includes(f.campType)) return false;
  if (f.month && !s.dates.some(d => d.toLowerCase().startsWith(f.month.toLowerCase()))) return false;
  if (upcomingOnly && s.status === 'completed') return false;
  if (f.search) {
    const stateName = STATE_NAMES[s.state] || '';
    const hay = (s.school_name + ' ' + s.conference + ' ' + s.division + ' ' + stateName + ' ' + s.state + ' ' + s.camp_types.join(' ')).toLowerCase();
    if (!hay.includes(f.search)) return false;
  }
  return true;
}

function sortResults(list, sortKey) {
  const copy = [...list];
  const statusFirst = (a, b) => {
    if (a.status !== b.status) return a.status === 'upcoming' ? -1 : 1;
    return 0;
  };
  if (sortKey === 'school') copy.sort((a, b) => statusFirst(a, b) || a.school_name.localeCompare(b.school_name));
  else if (sortKey === 'division') copy.sort((a, b) => statusFirst(a, b) || a.division.localeCompare(b.division) || a.school_name.localeCompare(b.school_name));
  else copy.sort((a, b) => statusFirst(a, b) || (a.date_sort || '').localeCompare(b.date_sort || '') || a.school_name.localeCompare(b.school_name));
  return copy;
}

function getFiltered() {
  const f = getFilters();
  return sortResults(campData.filter(s => matchesFilters(s, f)), f.sort);
}

function populateFilters() {
  const states = [...new Set(campData.map(d => d.state).filter(Boolean))].sort();
  const stateSel = document.getElementById('filter-state');
  states.forEach(st => {
    const o = document.createElement('option');
    o.value = st;
    o.textContent = STATE_NAMES[st] ? `${STATE_NAMES[st]} (${st})` : st;
    stateSel.appendChild(o);
  });
  updateConferenceOptions();
  const types = [...new Set(campData.flatMap(d => d.camp_types))].sort();
  const ts = document.getElementById('filter-camp-type');
  types.forEach(t => {
    const o = document.createElement('option');
    o.value = t;
    o.textContent = t;
    ts.appendChild(o);
  });
}

function updateConferenceOptions() {
  const div = document.getElementById('filter-division').value;
  const st = document.getElementById('filter-state').value;
  const cs = document.getElementById('filter-conference');
  const cur = cs.value;
  cs.innerHTML = '<option value="">All Conferences</option>';
  let src = campData;
  if (div) src = src.filter(d => d.division === div);
  if (st) src = src.filter(d => d.state === st);
  [...new Set(src.map(d => d.conference))].sort().forEach(c => {
    const o = document.createElement('option');
    o.value = c;
    o.textContent = c;
    cs.appendChild(o);
  });
  if ([...cs.options].some(o => o.value === cur)) cs.value = cur;
}

function updateMap() {
  markerLayer.clearLayers();
  const filtered = getFiltered();
  for (const s of filtered) {
    const c = schoolCoords[s.school_name];
    if (!c) continue;
    const color = DIV_COLORS[s.division] || '#999';
    const mk = L.circleMarker(c, { radius: 7, fillColor: color, color: '#111', weight: 2, fillOpacity: .9 });
    const camps = s.camp_types.map(t => '<li>' + escHtml(t) + '</li>').join('');
    const dates = s.dates.map(d => escHtml(d)).join('<br>');
    const loc = s.state ? escHtml(STATE_NAMES[s.state] || s.state) : '';
    const link = s.registration_url ? '<a class="popup-link" href="' + escHtml(s.registration_url) + '" target="_blank" rel="noopener">Register →</a>' : '';
    const tw = s.twitter_handle ? '<div style="font-size:.78rem;margin-top:4px"><a href="https://x.com/' + escHtml(s.twitter_handle.replace('@','')) + '" target="_blank" rel="noopener" style="color:var(--text)">' + escHtml(s.twitter_handle) + '</a></div>' : '';
    mk.bindPopup(
      '<div class="popup-school">' + escHtml(s.school_name) + '</div>' +
      '<span class="badge badge-' + s.division + '">' + s.division + '</span>' +
      '<div class="popup-conf">' + escHtml(s.conference) + (loc ? ' · ' + loc : '') + '</div>' +
      '<ul class="popup-camps">' + camps + '</ul>' +
      '<div style="font-size:.78rem;color:#a89a86;line-height:1.4">' + dates + '</div>' +
      link + tw
    );
    mk.addTo(markerLayer);
  }
  updateStats(filtered.length);
}

function updateGrid() {
  const grid = document.getElementById('card-grid');
  const filtered = getFiltered();
  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results">No camps match your filters. Try clearing filters or turning off Upcoming Only.</div>';
    updateStats(0);
    return;
  }
  grid.innerHTML = filtered.map(s => {
    const url = s.registration_url;
    const camps = s.camp_types.map(t => '<li><strong>' + escHtml(t) + '</strong></li>').join('');
    const link = url ? '<a class="reg-link" href="' + escHtml(url) + '" target="_blank" rel="noopener">Register →</a>' : '<span class="no-reg">Registration link not listed — check athletics site</span>';
    const tw = s.twitter_handle ? '<a class="twitter-link" href="https://x.com/' + escHtml(s.twitter_handle.replace('@','')) + '" target="_blank" rel="noopener">' + escHtml(s.twitter_handle) + '</a>' : '';
    const loc = s.state ? escHtml(STATE_NAMES[s.state] || s.state) : 'Location TBD';
    const nextDate = s.dates[0] ? '<span style="color:var(--accent);font-weight:600">Next: ' + escHtml(s.dates[0]) + '</span>' : '';
    const completed = s.status === 'completed' ? ' completed' : '';
    const completedTag = s.status === 'completed' ? '<span class="completed-tag">Completed</span>' : '';
    return '<div class="camp-card' + completed + '" data-div="' + s.division + '">' +
      '<div class="card-header"><div class="school-name">' + escHtml(s.school_name) + '</div><div style="display:flex;gap:6px;align-items:center">' + completedTag + '<span class="badge badge-' + s.division + '">' + s.division + '</span></div></div>' +
      '<div class="meta">' + escHtml(s.conference) + ' · ' + loc + '<br>' + nextDate + '</div>' +
      '<ul class="camp-list">' + camps + '</ul>' +
      '<div class="camp-dates" style="margin-bottom:10px">' + s.dates.map(d => escHtml(d)).join(' · ') + '</div>' +
      '<div class="card-footer">' + link + tw + '</div></div>';
  }).join('');
  updateStats(filtered.length);
}

function updateStats(n) {
  document.getElementById('stats').textContent = n + ' of ' + campData.length + ' schools · June-heavy 2026 season';
}

function setView(v) {
  currentView = v;
  document.getElementById('btn-map').classList.toggle('active', v === 'map');
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('map-container').style.display = v === 'map' ? 'block' : 'none';
  document.getElementById('grid-container').style.display = v === 'grid' ? 'block' : 'none';
  if (v === 'map') { map.invalidateSize(); updateMap(); }
  else updateGrid();
}

function clearFilters() {
  ['filter-division','filter-state','filter-conference','filter-camp-type','filter-month'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('filter-sort').value = 'soonest';
  document.getElementById('search').value = '';
  upcomingOnly = true;
  document.getElementById('toggle-upcoming').classList.add('active');
  updateConferenceOptions();
  applyFilters();
}

function applyFilters() {
  if (currentView === 'map') updateMap();
  else updateGrid();
}

function initMap() {
  map = L.map('map', { scrollWheelZoom: true }).setView([39.5, -96], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OSM © CARTO', maxZoom: 18
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

async function loadData() {
  const [campsRes, coordsRes] = await Promise.all([
    fetch('camps_master.json'),
    fetch('school_coords.json')
  ]);
  if (!campsRes.ok || !coordsRes.ok) throw new Error('Failed to load camp data files');
  campData = await campsRes.json();
  schoolCoords = await coordsRes.json();
}

document.getElementById('toggle-upcoming').addEventListener('click', function () {
  upcomingOnly = !upcomingOnly;
  this.classList.toggle('active', upcomingOnly);
  this.textContent = upcomingOnly ? 'Upcoming Only' : 'Show All Dates';
  applyFilters();
});

let searchTimer;
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters, 250);
});

['filter-division','filter-state','filter-conference','filter-camp-type','filter-month','filter-sort'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (id === 'filter-division' || id === 'filter-state') updateConferenceOptions();
    applyFilters();
  });
});

window.addEventListener('load', async () => {
  try {
    await loadData();
    populateFilters();
    initMap();
    updateMap();
    setTimeout(() => {
      map.invalidateSize();
      map.setView([39.5, -96], 5);
      updateMap();
    }, 250);
  } catch (e) {
    const el = document.getElementById('load-error');
    el.style.display = 'block';
    el.textContent = 'Could not load camp data. If viewing locally, serve via a local web server (GitHub Pages works automatically).';
    console.error(e);
  }
});
</script>
</body>
</html>
